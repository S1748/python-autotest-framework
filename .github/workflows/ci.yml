name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. 语法编译检查：最快的一关，先把明显写错的文件拦下来
  # ---------------------------------------------------------------
  lint:
    name: 语法编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 编译全部 Python 源码
        run: python -m compileall -q base common conf testcase tests run.py conftest.py

  # ---------------------------------------------------------------
  # 2. 框架单元测试
  #
  # 只跑 tests/ 下不依赖被测系统的纯逻辑用例：
  #   DebugTalk 工具方法、${} 占位符替换、五种断言模式、
  #   配置读取、YAML 加载、密钥防泄漏守卫。
  #
  # testcase/ 下的接口用例需要连 [api_envi] host 指向的测试环境
  # 以及 MySQL / Redis，CI 里没有这些依赖，所以不在这里跑，
  # 它们由下一个 collect job 做「收集阶段」校验。
  # ---------------------------------------------------------------
  unit-test:
    name: 框架单元测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装 CI 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 校验 requirements.txt 可完整解析
        run: pip install --dry-run -r requirements.txt

      - name: 运行单元测试
        run: pytest tests/ -v --durations=10

  # ---------------------------------------------------------------
  # 3. 用例收集校验
  #
  # 不真正发请求，只做 collection：
  #   - testcase/ 下所有 YAML 必须是合法 YAML
  #   - 每条用例必须能被 @pytest.mark.parametrize 正常展开
  # 这一关能拦住「YAML 缩进写错导致整个模块 0 用例」这类问题。
  # ---------------------------------------------------------------
  collect:
    name: 用例收集校验
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装 CI 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 收集 testcase 下全部用例
        run: |
          set +e
          output=$(pytest --collect-only -q testcase/ 2>&1)
          code=$?
          echo "$output" | tail -5
          if [ "$code" -ne 0 ]; then
            echo "::error::用例收集失败，退出码 ${code}，请检查 testcase 下的 YAML"
            exit 1
          fi
          collected=$(echo "$output" | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' | head -1)
          if [ -z "$collected" ] || [ "$collected" -lt 20 ]; then
            echo "::error::用例收集数量异常：${collected:-0} 条（预期 >= 20），YAML 可能被改坏"
            exit 1
          fi
          echo "共收集到 ${collected} 条用例"
